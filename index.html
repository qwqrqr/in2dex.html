<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, query, orderBy,
  onSnapshot, serverTimestamp, updateDoc, doc, increment, deleteDoc
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyDFbUMQFzMG_tBml3OfS7OMCPdK_1zO_jE",
  authDomain: "qwertyui-1eb9f.firebaseapp.com",
  projectId: "qwertyui-1eb9f",
  storageBucket: "qwertyui-1eb9f.firebasestorage.app",
  messagingSenderId: "507498046800",
  appId: "1:507498046800:web:9b58732dbb6e2c3bbaf855",
  measurementId: "G-Z4DGBDF1NK"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Увеличение лайков
window.processLike = async (id) => {
  const docRef = doc(db, "requests", id);
  await updateDoc(docRef, { likes: increment(1) });
};

// 1️⃣ Функция: удалить запись
window.deleteRequest = async (id) => {
  if (!confirm("Вы уверены, что хотите удалить запись?")) return;
  const docRef = doc(db, "requests", id);
  await deleteDoc(docRef);
};

// 2️⃣ Функция: обновить email
window.updateEmail = async (id, newEmail) => {
  if (!newEmail.trim()) {
    alert("Email не может быть пустым");
    return;
  }
  const docRef = doc(db, "requests", id);
  await updateDoc(docRef, { email: newEmail });
};

// Добавление новой записи
document.getElementById('mainBtn').onclick = async () => {
  const btn = document.getElementById('mainBtn');
  btn.disabled = true;

  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();

  if (!name || !email) {
    alert("Заполните все поля");
    btn.disabled = false;
    return;
  }

  await addDoc(collection(db, "requests"), {
    name,
    email,
    likes: 0,
    timestamp: serverTimestamp()
  });

  document.getElementById('name').value = "";
  document.getElementById('email').value = "";
  btn.disabled = false;
};

// Вывод feed
const q = query(collection(db, "requests"), orderBy("timestamp", "desc"));

onSnapshot(q, (snapshot) => {
  const feed = document.getElementById('feed');
  feed.innerHTML = "";

  snapshot.forEach((docItem) => {
    const data = docItem.data();
    const time = data.timestamp?.toDate().toLocaleTimeString() || "...";

    feed.innerHTML += `
      <div class="post">
        <span class="time">${time}</span>
        <b>${data.name}</b>
        <p style="margin:5px 0;">${data.email}</p>
        <button class="like-btn" onclick="processLike('${docItem.id}')">
          👍 ${data.likes || 0}
        </button>
        <button class="like-btn" onclick="deleteRequest('${docItem.id}')">
          🗑 Удалить
        </button>
        <button class="like-btn" onclick="updateEmail('${docItem.id}', prompt('Введите новый email:', '${data.email}'))">
          ✏️ Обновить email
        </button>
      </div>
    `;
  });
});
</script>

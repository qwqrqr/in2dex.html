<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>BaaS + Авторизация + Загрузка изображений</title>

<style>
body {
  font-family: 'Inter', sans-serif;
  background: #f4f7f6;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 500px;
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.05);
  margin-bottom: 20px;
}

#loginBtn, #logoutBtn, #mainBtn {
  background: #007bff;
  color: white;
  border: none;
  padding: 12px;
  border-radius: 6px;
  width: 100%;
  font-weight: 600;
  cursor: pointer;
  transition: 0.3s;
}

#logoutBtn {
  background: #ff4757;
  margin-top: 10px;
}

input, #imageInput {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border: 1px solid #ddd;
  border-radius: 6px;
  box-sizing: border-box;
}

.post {
  background: #fff;
  border: 1px solid #eaeaea;
  padding: 15px;
  margin-top: 15px;
  border-radius: 8px;
  width: 100%;
  max-width: 500px;
}

.like-btn {
  cursor: pointer;
  border: none;
  background: #f8f9fa;
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 14px;
  margin-right: 5px;
}

.time {
  font-size: 11px;
  color: #999;
  float: right;
}
</style>
</head>
<body>

<!-- ===== АВТОРИЗАЦИЯ ===== -->
<div class="container" style="text-align:center;">
  <button id="loginBtn">Войти через Google</button>

  <div id="userInfo" style="display:none;">
    <img id="userPhoto" width="40" style="border-radius:50%; margin-top:10px;">
    <div id="userName" style="font-weight:bold; margin:5px 0;"></div>
    <button id="logoutBtn">Выйти</button>
  </div>
</div>

<!-- ===== ФОРМА ===== -->
<div class="container" id="formContainer" style="display:none;">
  <h3>Панель управления данными</h3>
  <input type="text" id="name" readonly>
  <input type="email" id="email" readonly>
  <input type="file" id="imageInput" accept="image/*">
  <img id="preview" width="100" style="display:none; margin-top:10px; border-radius:8px;">
  <button id="mainBtn">Опубликовать в облако</button>
</div>

<!-- ===== ЛЕНТА ===== -->
<div id="feed" style="width: 100%; max-width: 500px;"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { 
  getFirestore, 
  collection, 
  addDoc, 
  query, 
  orderBy, 
  onSnapshot, 
  serverTimestamp, 
  updateDoc, 
  doc, 
  increment, 
  deleteDoc 
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

import { 
  getAuth, 
  GoogleAuthProvider, 
  signInWithPopup, 
  signOut, 
  onAuthStateChanged 
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-storage.js";

/* ===== FIREBASE CONFIG ===== */
const firebaseConfig = {
  apiKey: "AIzaSyDFbUMQFzMG_tBml3OfS7OMCPdK_1zO_jE",
  authDomain: "qwertyui-1eb9f.firebaseapp.com",
  projectId: "qwertyui-1eb9f",
  storageBucket: "qwertyui-1eb9f.firebasestorage.app",
  messagingSenderId: "507498046800",
  appId: "1:507498046800:web:9b58732dbb6e2c3bbaf855",
  measurementId: "G-Z4DGBDF1NK"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
const storage = getStorage(app);

/* ===== ЭЛЕМЕНТЫ ===== */
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const userInfo = document.getElementById("userInfo");
const formContainer = document.getElementById("formContainer");
const imageInput = document.getElementById("imageInput");
const preview = document.getElementById("preview");

/* ===== ВХОД/ВЫХОД ===== */
loginBtn.onclick = () => signInWithPopup(auth, provider);
logoutBtn.onclick = () => signOut(auth);

onAuthStateChanged(auth, (user) => {
  if (user) {
    loginBtn.style.display = "none";
    userInfo.style.display = "block";
    formContainer.style.display = "block";

    document.getElementById("userName").innerText = user.displayName;
    document.getElementById("userPhoto").src = user.photoURL;
    document.getElementById("name").value = user.displayName;
    document.getElementById("email").value = user.email;
  } else {
    loginBtn.style.display = "block";
    userInfo.style.display = "none";
    formContainer.style.display = "none";
  }
});

/* ===== ПРЕВЬЮ КАРТИНКИ ===== */
imageInput.onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
};

/* ===== ДОБАВЛЕНИЕ ЗАПИСИ С КАРТИНКОЙ И ИМЕНЕМ ФАЙЛА ===== */
document.getElementById("mainBtn").onclick = async () => {
  const user = auth.currentUser;
  if (!user) {
    alert("Сначала войдите");
    return;
  }

  let imageUrl = null;
  let imageName = null;

  if (imageInput.files.length > 0) {
    const file = imageInput.files[0];
    imageName = file.name;
    const storageRef = ref(storage, `images/${user.uid}_${Date.now()}_${file.name}`);
    try {
      await uploadBytes(storageRef, file);
      imageUrl = await getDownloadURL(storageRef);
    } catch (err) {
      console.error("Ошибка загрузки файла:", err);
      alert("Ошибка загрузки картинки");
      return;
    }
  }

  try {
    await addDoc(collection(db, "requests"), {
      name: user.displayName,
      email: user.email,
      likes: 0,
      timestamp: serverTimestamp(),
      image: imageUrl,
      imageName: imageName
    });
  } catch (err) {
    console.error("Ошибка публикации:", err);
    alert("Ошибка публикации в Firestore");
    return;
  }

  imageInput.value = "";
  preview.style.display = "none";
};

/* ===== ЛАЙКИ И УДАЛЕНИЕ ===== */
window.processLike = async (id) => {
  await updateDoc(doc(db, "requests", id), { likes: increment(1) });
};

window.deleteRequest = async (id) => {
  if (!confirm("Удалить запись?")) return;
  await deleteDoc(doc(db, "requests", id));
};

/* ===== ВЫВОД ЛЕНТЫ С ИМЕНЕМ ФАЙЛА ===== */
const q = query(collection(db, "requests"), orderBy("timestamp", "desc"));

onSnapshot(q, (snapshot) => {
  const feed = document.getElementById("feed");
  feed.innerHTML = "";

  snapshot.forEach((docItem) => {
    const data = docItem.data();
    const time = data.timestamp?.toDate().toLocaleTimeString() || "...";

    feed.innerHTML += `
      <div class="post">
        <span class="time">${time}</span>
        <b>${data.name}</b>
        <p>${data.email}</p>
        ${data.image ? `<p>Файл: ${data.imageName}</p><img src="${data.image}" width="100%" style="margin-top:10px; border-radius:8px;">` : ""}
        <button class="like-btn" onclick="processLike('${docItem.id}')">👍 ${data.likes || 0}</button>
        <button class="like-btn" onclick="deleteRequest('${docItem.id}')">🗑</button>
      </div>
    `;
  });
});
</script>
</body>
</html>

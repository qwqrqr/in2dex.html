<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Firebase DM App</title>
<style>
body { font-family: Arial; background:#f4f7f6; padding:20px; }
.container { max-width:600px; margin:auto; background:white; padding:20px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.05); margin-bottom:20px; }
button { padding:8px; margin-top:5px; cursor:pointer; }
.post { border:1px solid #ddd; padding:10px; margin-bottom:10px; border-radius:8px; }
#chatBox { border:1px solid #ccc; padding:10px; height:300px; overflow-y:auto; margin-bottom:10px; }
.my { text-align:right; color:blue; }
.other { text-align:left; color:black; }
</style>
</head>
<body>

<div class="container">
  <button id="loginBtn">Войти через Google</button>
  <button id="logoutBtn" style="display:none;">Выйти</button>
</div>

<div class="container" id="postContainer" style="display:none;">
  <button id="publishBtn">Создать тестовый пост</button>
</div>

<div class="container">
  <h3>Лента</h3>
  <div id="feed"></div>
</div>

<div class="container" id="chatContainer" style="display:none;">
  <h3>Чат</h3>
  <div id="chatBox"></div>
  <input id="messageInput" placeholder="Сообщение">
  <button id="sendBtn">Отправить</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { 
  getFirestore, collection, addDoc, doc, setDoc, getDoc,
  query, orderBy, onSnapshot, serverTimestamp,
  updateDoc, deleteDoc
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
import { 
  getAuth, GoogleAuthProvider, signInWithPopup,
  signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

// 🔥 ВСТАВЬ СВОЙ CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyDFbUMQFzMG_tBml3OfS7OMCPdK_1zO_jE",
  authDomain: "qwertyui-1eb9f.firebaseapp.com",
  projectId: "qwertyui-1eb9f",
  storageBucket: "qwertyui-1eb9f.firebasestorage.app",
  messagingSenderId: "507498046800",
  appId: "1:507498046800:web:9b58732dbb6e2c3bbaf855",
  measurementId: "G-Z4DGBDF1NK"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const postContainer = document.getElementById("postContainer");
const publishBtn = document.getElementById("publishBtn");
const feed = document.getElementById("feed");
const chatContainer = document.getElementById("chatContainer");
const chatBox = document.getElementById("chatBox");
const sendBtn = document.getElementById("sendBtn");

let currentChatId = null;
let unsubscribeMessages = null;

// ===== AUTH =====
loginBtn.onclick = () => signInWithPopup(auth, provider);
logoutBtn.onclick = () => signOut(auth);

onAuthStateChanged(auth, async user => {
  if (user) {
    loginBtn.style.display = "none";
    logoutBtn.style.display = "block";
    postContainer.style.display = "block";

    // сохраняем пользователя
    await setDoc(doc(db, "users", user.uid), {
      uid: user.uid,
      name: user.displayName,
      email: user.email,
      photoURL: user.photoURL,
      createdAt: serverTimestamp()
    }, { merge:true });

    loadPosts();

  } else {
    loginBtn.style.display = "block";
    logoutBtn.style.display = "none";
    postContainer.style.display = "none";
  }
});

// ===== СОЗДАТЬ ТЕСТОВЫЙ ПОСТ =====
publishBtn.onclick = async () => {
  const user = auth.currentUser;
  await addDoc(collection(db, "requests"), {
    uid: user.uid,
    name: user.displayName,
    email: user.email,
    timestamp: serverTimestamp()
  });
};

// ===== ЛЕНТА =====
function loadPosts() {
  const q = query(collection(db, "requests"), orderBy("timestamp", "desc"));

  onSnapshot(q, snapshot => {
    feed.innerHTML = "";
    snapshot.forEach(docItem => {
      const data = docItem.data();
      const div = document.createElement("div");
      div.className = "post";

      // Кнопка удалить только для автора
      const deleteBtn = auth.currentUser && auth.currentUser.uid === data.uid
        ? `<button onclick="deletePost('${docItem.id}')">🗑 Удалить</button>` 
        : "";

      div.innerHTML = `
        <b>${data.name}</b><br>
        ${data.email}<br>
        <button onclick="openChat('${data.uid}')">💬 Написать</button>
        ${deleteBtn}
      `;
      feed.appendChild(div);
    });
  });
}

// ===== УДАЛЕНИЕ ПОСТА =====
window.deletePost = async (postId) => {
  try {
    await deleteDoc(doc(db, "requests", postId));
  } catch (err) {
    alert("Ошибка при удалении: " + err.message);
  }
};

// ===== ОТКРЫТЬ ЧАТ =====
window.openChat = async (receiverUid) => {
  const user = auth.currentUser;
  if (receiverUid === user.uid) return alert("Нельзя писать себе");

  const chatId = [user.uid, receiverUid].sort().join("_");
  currentChatId = chatId;

  const chatRef = doc(db, "chats", chatId);
  const chatSnap = await getDoc(chatRef);

  if (!chatSnap.exists()) {
    await setDoc(chatRef, {
      participants: [user.uid, receiverUid],
      lastMessage: "",
      updatedAt: serverTimestamp()
    });
  }

  chatContainer.style.display = "block";
  loadMessages(chatId);
};

// ===== ЗАГРУЗКА СООБЩЕНИЙ =====
function loadMessages(chatId) {
  if (unsubscribeMessages) unsubscribeMessages();

  const q = query(
    collection(db, "chats", chatId, "messages"),
    orderBy("timestamp", "asc")
  );

  unsubscribeMessages = onSnapshot(q, snapshot => {
    chatBox.innerHTML = "";
    snapshot.forEach(doc => {
      const data = doc.data();
      const p = document.createElement("p");
      p.className = data.senderId === auth.currentUser.uid ? "my" : "other";
      p.textContent = data.text;
      chatBox.appendChild(p);
    });
    chatBox.scrollTop = chatBox.scrollHeight;
  });
}

// ===== ОТПРАВКА =====
sendBtn.onclick = async () => {
  if (!currentChatId) return alert("Чат не выбран");

  const input = document.getElementById("messageInput");
  const text = input.value.trim();
  if (!text) return;

  await addDoc(collection(db, "chats", currentChatId, "messages"), {
    text,
    senderId: auth.currentUser.uid,
    timestamp: serverTimestamp()
  });

  await updateDoc(doc(db, "chats", currentChatId), {
    lastMessage: text,
    updatedAt: serverTimestamp()
  });

  input.value = "";
};
</script>
</body>
</html>

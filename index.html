 <!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>BaaS</title>

<style>
body {
  font-family: 'Inter', sans-serif;
  background: #f4f7f6;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 500px;
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.05);
}

input {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border: 1px solid #ddd;
  border-radius: 6px;
  box-sizing: border-box;
}

#mainBtn {
  background: #007bff;
  color: white;
  border: none;
  padding: 12px;
  border-radius: 6px;
  width: 100%;
  font-weight: 600;
  cursor: pointer;
  transition: 0.3s;
}

.post {
  background: #fff;
  border: 1px solid #eaeaea;
  padding: 15px;
  margin-top: 15px;
  border-radius: 8px;
  width: 100%;
  max-width: 500px;
}

.like-btn {
  cursor: pointer;
  border: none;
  background: #f8f9fa;
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 14px;
  transition: 0.25s;
}

.like-btn:hover {
  background: #e9ecef;
}

.time {
  font-size: 11px;
  color: #999;
  float: right;
}
</style>
</head>

<body>

<div class="container">
<h3>Панель управления данными</h3>
<input type="text" id="name" placeholder="Имя профиля">
<input type="email" id="email" placeholder="Рабочий Email">
<button id="mainBtn">Опубликовать в облако</button>
</div>

<div id="feed" style="width: 100%; max-width: 500px;"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, query, orderBy,
  onSnapshot, serverTimestamp, updateDoc, doc, increment
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
   apiKey: "AIzaSyCTQQzvdVojRikErH4YzUNqdGzoEFQV1UI",
  authDomain: "project-4423897207825709424.firebaseapp.com",
  projectId: "project-4423897207825709424",
  storageBucket: "project-4423897207825709424.firebasestorage.app",
  messagingSenderId: "969813649079",
  appId: "1:969813649079:web:9f355af002f17704a80f32",
  measurementId: "G-K3WS9J8HK7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.processLike = async (id) => {
  const docRef = doc(db, "requests", id);
  await updateDoc(docRef, { likes: increment(1) });
};

document.getElementById('mainBtn').onclick = async () => {
  const btn = document.getElementById('mainBtn');
  btn.disabled = true;

  await addDoc(collection(db, "requests"), {
    name: document.getElementById('name').value,
    email: document.getElementById('email').value,
    likes: 0,
    timestamp: serverTimestamp()
  });

  document.getElementById('email').value = "";
  btn.disabled = false;
};

const q = query(collection(db, "requests"), orderBy("timestamp", "desc"));

onSnapshot(q, (snapshot) => {
  const feed = document.getElementById('feed');
  feed.innerHTML = "";

  snapshot.forEach((docItem) => {
    const data = docItem.data();

    feed.innerHTML += `
      <div class="post">
        <span class="time">${data.timestamp?.toDate().toLocaleTimeString() || '...'}</span>
        <b>${data.name}</b>
        <p style="margin:5px 0;">${data.email}</p>
        <button class="like-btn" onclick="processLike('${docItem.id}')">
          👍 ${data.likes || 0}
        </button>
      </div>
    `;
  });
});
</script>

</body>
</html>

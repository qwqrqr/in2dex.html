<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Firebase DM с разделениями</title>
<style>
  body { font-family: Arial, sans-serif; background:#eef2f7; margin:0; padding:20px; }
  header { background:#4e73df; color:white; padding:15px; text-align:center; font-size:1.5em; }
  .container { max-width:900px; margin:20px auto; background:white; padding:20px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.1); }
  button { cursor:pointer; padding:8px 12px; border:none; border-radius:6px; background:#4e73df; color:white; margin:5px; transition:0.2s; }
  button:hover { background:#2e59d9; }
  .post { border:1px solid #ddd; padding:12px; margin-bottom:12px; border-radius:10px; background:#f8f9fc; }
  img { max-width: 100%; border-radius:12px; margin:8px 0; }
  #chatBox { border:1px solid #ccc; padding:10px; height:300px; overflow-y:auto; margin-bottom:10px; border-radius:8px; background:#f1f3f5; }
  .my { text-align:right; color:blue; margin:3px 0; }
  .other { text-align:left; color:black; margin:3px 0; }
  input, textarea { width:100%; padding:8px; border-radius:6px; border:1px solid #ccc; margin-top:5px; box-sizing:border-box; }
  .section { display:none; }
  #tabs button { margin-right:5px; background:#6c757d; }
  #tabs button.active { background:#4e73df; }
  #usersList div, #onlineUsers div { margin-bottom: 6px; }
</style>
</head>
<body>

<header>🔥 Firebase DM App</header>

<div class="container" id="authContainer">
  <button id="loginBtn">Войти через Google</button>
  <button id="logoutBtn" style="display:none;">Выйти</button>
</div>

<div class="container" id="tabs" style="display:none;">
  <button id="myPostsTab" class="active">Мои посты</button>
  <button id="feedTab">Лента пользователей</button>
  <button id="usersTab">Пользователи</button>
  <button id="onlineTab">Кто зашёл</button>
  <button id="chatTab">Чат</button>
</div>

<!-- Мои посты -->
<div class="container section" id="myPostsSection">
  <h3>Мои посты</h3>
  <button id="createPostBtn">Создать пост</button>
  <div id="myPosts"></div>
</div>

<!-- Лента пользователей -->
<div class="container section" id="feedSection">
  <h3>Лента пользователей</h3>
  <div id="feedPosts"></div>
</div>

<!-- Список пользователей -->
<div class="container section" id="usersSection">
  <h3>Пользователи</h3>
  <div id="usersList"></div>
</div>

<!-- Кто зашёл -->
<div class="container section" id="onlineSection">
  <h3>Кто зашёл (онлайн за 5 мин)</h3>
  <div id="onlineUsers"></div>
</div>

<!-- Чат -->
<div class="container section" id="chatSection">
  <h3>Чат</h3>
  <div id="chatBox"></div>
  <input id="messageInput" placeholder="Введите сообщение">
  <button id="sendBtn">Отправить</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, doc, setDoc, getDoc,
  query, orderBy, onSnapshot, serverTimestamp,
  updateDoc, deleteDoc, arrayUnion, where, Timestamp
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup,
  signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDFbUMQFzMG_tBml3OfS7OMCPdK_1zO_jE",
  authDomain: "qwertyui-1eb9f.firebaseapp.com",
  projectId: "qwertyui-1eb9f",
  storageBucket: "qwertyui-1eb9f.appspot.com",
  messagingSenderId: "507498046800",
  appId: "1:507498046800:web:9b58732dbb6e2c3bbaf855",
  measurementId: "G-Z4DGBDF1NK"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const tabs = document.getElementById("tabs");
const myPostsTab = document.getElementById("myPostsTab");
const feedTab = document.getElementById("feedTab");
const usersTab = document.getElementById("usersTab");
const onlineTab = document.getElementById("onlineTab");
const chatTab = document.getElementById("chatTab");

const myPostsSection = document.getElementById("myPostsSection");
const feedSection = document.getElementById("feedSection");
const usersSection = document.getElementById("usersSection");
const onlineSection = document.getElementById("onlineSection");
const chatSection = document.getElementById("chatSection");

const createPostBtn = document.getElementById("createPostBtn");
const myPosts = document.getElementById("myPosts");
const feedPosts = document.getElementById("feedPosts");
const usersListDiv = document.getElementById("usersList");
const onlineUsersDiv = document.getElementById("onlineUsers");

const chatBox = document.getElementById("chatBox");
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");

let currentChatId = null;
let unsubscribeMessages = null;

// === Аутентификация ===
loginBtn.onclick = () => signInWithPopup(auth, provider);
logoutBtn.onclick = () => signOut(auth);

onAuthStateChanged(auth, async user => {
  if(user){
    loginBtn.style.display = "none";
    logoutBtn.style.display = "inline-block";
    tabs.style.display = "block";
    showSection("myPosts");
    // Обновляем lastSeen
    await updateLastSeen();
    setInterval(updateLastSeen, 5*60*1000);
    // Сохраняем/обновляем пользователя
    await setDoc(doc(db, "users", user.uid), {
      uid: user.uid,
      name: user.displayName,
      email: user.email,
      photoURL: user.photoURL,
      createdAt: serverTimestamp(),
      lastSeen: serverTimestamp()
    }, {merge:true});

    loadMyPosts();
    loadFeed();
    loadUsers();
    loadOnlineUsers();
  } else {
    loginBtn.style.display = "inline-block";
    logoutBtn.style.display = "none";
    tabs.style.display = "none";
    hideAllSections();
  }
});

// === Вкладки ===
myPostsTab.onclick = () => showSection("myPosts");
feedTab.onclick = () => showSection("feed");
usersTab.onclick = () => showSection("users");
onlineTab.onclick = () => showSection("online");
chatTab.onclick = () => showSection("chat");

function showSection(name){
  hideAllSections();
  if(name==="myPosts") myPostsSection.style.display = "block";
  if(name==="feed") feedSection.style.display = "block";
  if(name==="users") usersSection.style.display = "block";
  if(name==="online") onlineSection.style.display = "block";
  if(name==="chat") chatSection.style.display = "block";

  [myPostsTab, feedTab, usersTab, onlineTab, chatTab].forEach(b => b.classList.remove("active"));
  if(name==="myPosts") myPostsTab.classList.add("active");
  if(name==="feed") feedTab.classList.add("active");
  if(name==="users") usersTab.classList.add("active");
  if(name==="online") onlineTab.classList.add("active");
  if(name==="chat") chatTab.classList.add("active");
}

function hideAllSections(){
  myPostsSection.style.display = "none";
  feedSection.style.display = "none";
  usersSection.style.display = "none";
  onlineSection.style.display = "none";
  chatSection.style.display = "none";
}

// === Создать пост ===
createPostBtn.onclick = async () => {
  const user = auth.currentUser;
  if(!user) return alert("Войдите чтобы создать пост");
  const text = prompt("Введите текст поста:");
  if(!text) return;

  await addDoc(collection(db, "requests"), {
    uid: user.uid,
    name: user.displayName,
    email: user.email,
    text,
    likes: [],
    timestamp: serverTimestamp()
  });
};

// === Мои посты ===
function loadMyPosts(){
  const user = auth.currentUser;
  if(!user) return;
  const q = query(collection(db, "requests"), orderBy("timestamp","desc"));
  onSnapshot(q, snapshot => {
    myPosts.innerHTML = "";
    snapshot.forEach(docItem => {
      const data = docItem.data();
      if(data.uid !== user.uid) return;

      const div = document.createElement("div");
      div.className = "post";
      div.innerHTML = `
        <b>${data.name}</b><br>
        ${data.text}<br>
        Лайки: ${data.likes ? data.likes.length : 0}
        <div>
          <button onclick="deletePost('${docItem.id}')">🗑 Удалить</button>
          <button onclick="likePost('${docItem.id}')">👍 Лайк</button>
        </div>
      `;
      myPosts.appendChild(div);
    });
  });
}

// === Лента пользователей ===
function loadFeed(){
  const user = auth.currentUser;
  if(!user) return;
  const q = query(collection(db, "requests"), orderBy("timestamp","desc"));
  onSnapshot(q, snapshot => {
    feedPosts.innerHTML = "";
    snapshot.forEach(docItem => {
      const data = docItem.data();
      if(data.uid === user.uid) return;

      const div = document.createElement("div");
      div.className = "post";
      div.innerHTML = `
        <b>${data.name}</b><br>
        ${data.text}<br>
        Лайки: ${data.likes ? data.likes.length : 0}
      `;
      feedPosts.appendChild(div);
    });
  });
}

// === Список пользователей ===
function loadUsers(){
  const user = auth.currentUser;
  if(!user) return;
  const q = query(collection(db, "users"), orderBy("name"));
  onSnapshot(q, snapshot => {
    usersListDiv.innerHTML = "";
    snapshot.forEach(docItem => {
      const data = docItem.data();
      if(data.uid === user.uid) return;

      const div = document.createElement("div");
      div.textContent = `${data.name} (${data.email}) `;
      const btn = document.createElement("button");
      btn.textContent = "Написать";
      btn.onclick = () => openChat(data.uid);
      div.appendChild(btn);

      usersListDiv.appendChild(div);
    });
  });
}

// === Кто зашёл (онлайн) ===
async function updateLastSeen(){
  const user = auth.currentUser;
  if(!user) return;
  await updateDoc(doc(db,"users",user.uid), { lastSeen: serverTimestamp() });
}

function loadOnlineUsers(){
  const fiveMinutesAgo = Timestamp.fromDate(new Date(Date.now() - 5*60*1000));
  const q = query(collection(db,"users"), where("lastSeen", ">", fiveMinutesAgo));
  onSnapshot(q, snapshot => {
    onlineUsersDiv.innerHTML = "";
    snapshot.forEach(docItem => {
      const data = docItem.data();
      onlineUsersDiv.innerHTML += `<div>${data.name} (${data.email})</div>`;
    });
  });
}

// === Удалить пост ===
window.deletePost = async (postId) => {
  try{
    await deleteDoc(doc(db,"requests",postId));
  } catch(e) {
    alert(e.message);
  }
};

// === Лайк поста ===
window.likePost = async (postId) => {
  const user = auth.currentUser;
  if(!user) return;
  await updateDoc(doc(db,"requests",postId), {
    likes: arrayUnion(user.uid)
  });
};

// === Открыть чат ===
window.openChat = async (receiverUid) => {
  const user = auth.currentUser;
  if(receiverUid === user.uid) return alert("Нельзя писать себе");
  currentChatId = [user.uid, receiverUid].sort().join("_");
  const chatRef = doc(db,"chats",currentChatId);
  const chatSnap = await getDoc(chatRef);
  if(!chatSnap.exists()){
    await setDoc(chatRef, {
      participants: [user.uid, receiverUid],
      lastMessage: "",
      updatedAt: serverTimestamp()
    });
  }
  showSection("chat");
  loadMessages(currentChatId);
};

// === Загрузка сообщений ===
function loadMessages(chatId){
  if(unsubscribeMessages) unsubscribeMessages();
  const q = query(collection(db,"chats",chatId,"messages"), orderBy("timestamp","asc"));
  unsubscribeMessages = onSnapshot(q, snapshot => {
    chatBox.innerHTML = "";
    snapshot.forEach(doc => {
      const data = doc.data();
      const p = document.createElement("p");
      p.className = data.senderId === auth.currentUser.uid ? "my" : "other";
      p.textContent = data.text;
      chatBox.appendChild(p);
    });
    chatBox.scrollTop = chatBox.scrollHeight;
  });
}

// === Отправить сообщение ===
sendBtn.onclick = async () => {
  if(!currentChatId) return alert("Чат не выбран");
  const text = messageInput.value.trim();
  if(!text) return;
  await addDoc(collection(db,"chats",currentChatId,"messages"), {
    text,
    senderId: auth.currentUser.uid,
    timestamp: serverTimestamp()
  });
  await updateDoc(doc(db,"chats",currentChatId), {
    lastMessage: text,
    updatedAt: serverTimestamp()
  });
  messageInput.value = "";
};
</script>

</body>
</html>
